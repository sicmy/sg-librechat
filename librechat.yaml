version: 1.3.14
cache: true

endpoints:
  allowedAddresses:
    - host.docker.internal:4000
  custom:
    - name: SG AI Gateway
      apiKey: "${SG_GATEWAY_API_KEY}"
      baseURL: http://host.docker.internal:4000/v1
      models:
        default:
          - general
          - reasoning
          - vision
          - validation-alt
        fetch: true
      titleConvo: true
      titleModel: general
      modelDisplayLabel: SG AI Gateway

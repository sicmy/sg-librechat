version: 1.3.14
cache: true

interface:
  modelSelect: false
  parameters: false

modelSpecs:
  prioritize: true
  enforce: true
  list:
    - name: sg-default
      label: SG AI Gateway
      default: true
      preset:
        endpoint: SG AI Gateway
        model: default

endpoints:
  allowedAddresses:
    - host.docker.internal:4000
  custom:
    - name: SG AI Gateway
      apiKey: "${SG_GATEWAY_API_KEY}"
      baseURL: http://host.docker.internal:4000/v1
      customParams:
        defaultParamsEndpoint: custom
        sgFileGateway: true
      models:
        default:
          - default
        fetch: true
      titleConvo: true
      titleModel: default
      modelDisplayLabel: SG AI Gateway
